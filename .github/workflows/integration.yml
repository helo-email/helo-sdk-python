name: Integration

# Full live tests against a running Helo API. Kept out of the main CI workflow
# so pushes/PRs stay fast and don't need a reachable API or credentials.
#
# Manual-only: these target a local instance (http://localhost:8000) by default,
# which doesn't exist on a hosted runner, so point them at a reachable
# environment by setting the `HELO_BASE_URL` repository variable and the
# `HELO_API_KEY` secret. Without `HELO_API_KEY` the tests skip.
on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run integration tests
        env:
          HELO_API_KEY: ${{ secrets.HELO_API_KEY }}
          HELO_BASE_URL: ${{ vars.HELO_BASE_URL }}
        run: pytest --integration -m integration -q
