[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "sdk_helo_email"
dynamic = ["version"]
description = "Helo API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["helo", "sdk", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "typing_extensions>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-httpx>=0.22",
    "pytest-asyncio>=0.21",
    "mypy>=1.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://api.helohq.com"
Documentation = "https://docs.helohq.com"
Repository = "https://github.com/helo-email/helo-sdk-python"

[tool.setuptools.dynamic]
version = {attr = "sdk_helo_email._version.__version__"}

[tool.setuptools.packages.find]
include = ["sdk_helo_email*"]

[tool.setuptools.package-data]
sdk_helo_email = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# Generated tests embed the documentation samples verbatim, and a sample value
# such as an HTML body is one unbreakable string literal.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
